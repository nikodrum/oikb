name: Build Windows GUI

# Builds the standalone oikb-gui.exe with PyInstaller.
# Triggered manually, or after the Release workflow completes
# (tags pushed with GITHUB_TOKEN don't fire push/tag triggers,
# so we chain off the Release workflow instead).

on:
  workflow_dispatch:
  push:
    branches: [windows-gui]
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .[all] pyinstaller

      - name: Build exe
        run: pyinstaller oikb-gui.spec

      - name: Smoke test (frozen CLI passthrough)
        shell: pwsh
        run: |
          # GUI-subsystem exe: invoke via Start-Process so pwsh waits for it.
          $p = Start-Process -FilePath "dist\oikb-gui.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) {
            Write-Error "oikb-gui.exe --version exited with $($p.ExitCode)"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: oikb-gui
          path: dist/oikb-gui.exe

      - name: Attach to release (if one exists for this version)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/oikb-gui.exe --clobber
          else
            echo "No release v$VERSION yet — exe available as workflow artifact only."
          fi
